[package]
name = "benched"
version = "0.1.0"
authors = ["the benched authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/benched"
description = "Easy benchmarking"

[lib]
name = "benched"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }