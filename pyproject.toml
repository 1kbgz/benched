[build-system]
requires = [
    "hatchling",
    "hatch-js",
]
build-backend = "hatchling.build"

[project]
name = "benched"
authors = [
    {name = "the benched authors", email = "dev@1kbgz.com"},
]
description = "Easy benchmarking"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "fsspec>=2024.6",
    "pluggy>=1.5,<2",
    "pytest>=8.1",
    "pytest-benchmark>=5.2,<6",
]

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatch-js",
    "hatchling",
    "jsonschema>=4.23",
    "mdformat",
    "mdformat-tables>=1",
    "myst-parser>=3",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx>=7",
    "twine",
    "ty",
    "uv",
    "wheel",
]
sphinx = [
    "sphinx>=7",
]

[project.scripts]
benched = "benched.cli:main"

[project.urls]
Repository = "https://github.com/1kbgz/benched"
Homepage = "https://github.com/1kbgz/benched"

[tool.benched]
benchmark_paths = ["benchmarks"]
results_dir = ".benched/results"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "benched/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "js/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "benched/tests/integration/",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = [
    "benched/extension",
]

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.hooks.hatch-js]
path = "js"
build_cmd = "build"
tool = "pnpm"
targets = [
    "benched/extension/cdn/index.js",
]

[tool.hatch.build.targets.sdist]
packages = [
    "benched",
    "benchmarks",
    "docs",
    "js",
]
exclude = [
    "benched/extension",
    "js/dist",
    "js/node_modules",
]

[tool.hatch.build.targets.wheel]
packages = [
    "benched",
]
exclude = [
    "js",
]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "benched/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "benched",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]
